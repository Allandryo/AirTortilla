spring.application.name=reservas
server.port=8080

# Directorio donde se generarán los ficheros divididos por país y fecha
airtortilla.output-dir=archivos_generados

# Límites de carga de archivos CSV
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Base de Datos H2 Relacional (Persistencia en archivo local)
spring.datasource.url=jdbc:h2:file:./data/airtortilla_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web de H2 (Disponible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
