spring.application.name=reservas
server.port=8080

airtortilla.output-dir=archivos_generados

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#El conector oficial de Java para hablar con H2.
spring.datasource.url=jdbc:h2:file:./data/airtortilla_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#Permite ver y editar tablas abriendo en el navegador http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
